name: Deploy Trello Webhook

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
            role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
            aws-region: us-east-1

      - name: Build Lambda package
        run: |
          mkdir -p package
          pip install -r requirements.txt -t package/
          cp webhook_handler.py trello.py google_sheets.py package/

      - name: Deploy Lambda
        uses: aws-actions/aws-lambda-deploy@v1.1.2
        with:
          function-name: trello-inventory-webhook
          package-type: Zip
          code-artifacts-dir: package
          handler: webhook_handler.lambda_handler
          runtime: python3.14
